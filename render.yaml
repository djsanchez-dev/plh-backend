services:
  - type: web
    name: plh-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70.0 -Djava.security.egd=file:/dev/./urandom
      - key: JPA_DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://plh-condominio.netlify.app,https://*.netlify.app,http://localhost:4200
      - key: JWT_SECRET
        generateValue: true
      - key: JDBC_DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 86400000
