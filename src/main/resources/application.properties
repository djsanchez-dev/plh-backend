spring.application.name=plh-backend
spring.config.import=optional:file:./application-local.properties
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/plh_condominio}
spring.datasource.username=${DATABASE_USERNAME:plh_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:UGxoQXV0aENvbmRvbWluaW9TZWN1cmVTZWNyZXRLZXlGb3JEZXZlbG9wbWVudE9ubHk=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
