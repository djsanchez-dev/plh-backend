spring.application.name=plh-backend
spring.config.import=optional:file:./application-local.properties

# Render inyecta PORT; en local sigue valiendo SERVER_PORT (8080)
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Render suele exponer DATABASE_URL como postgres://... y Supabase como jdbc:postgresql://...
# Soportamos ambos formatos para que el servicio funcione en cualquiera de los dos entornos.
# IMPORTANTE: Render entrega DATABASE_URL sin esquema JDBC y Hibernate necesita una URL completa.
# Por eso se prioriza JDBC_DATABASE_URL, y si no existe se normaliza DATABASE_URL a formato JDBC.
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/plh_condominio}}
spring.datasource.username=${DATABASE_USERNAME:plh_app}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
jakarta.persistence.jdbc.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/plh_condominio}}

# Pool pequeño y tolerante a cortes: sirve igual en local que contra el pooler de Supabase/Render
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:15000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:120000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_MS:60000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Orígenes separados por coma (frontend en Vercel/Cloudflare + localhost en dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.jwt.secret=${JWT_SECRET:UGxoQXV0aENvbmRvbWluaW9TZWN1cmVTZWNyZXRLZXlGb3JEZXZlbG9wbWVudE9ubHk=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=when_authorized
